<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Task Manager</title>
<style>
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --border: #d9d6d0;
    --text: #2b2b28;
    --muted: #77746e;
    --accent: #3a5a40;
    --accent-dark: #2c4530;
    --danger: #a83232;
    --todo: #9a9a9a;
    --progress: #b8860b;
    --done: #3a5a40;
    --priority-low: #6b8f9c;
    --priority-medium: #b8860b;
    --priority-high: #a83232;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px 0 32px;
  }
  h1 {
    margin: 0 0 16px 0;
    font-size: 22px;
    font-weight: 700;
  }
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    background: var(--bg);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .tab.active {
    background: var(--panel);
    color: var(--text);
    border-bottom: 2px solid var(--panel);
    margin-bottom: -2px;
  }
  main {
    padding: 24px 32px 48px 32px;
    max-width: 900px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0 6px 6px 6px;
    padding: 20px;
    display: none;
  }
  .panel.active { display: block; }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .panel-header h2 {
    font-size: 16px;
    margin: 0;
    color: var(--muted);
    font-weight: 600;
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--bg); color: var(--text); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: #832727; }

  .table-scroll {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }

  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }

  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: white;
  }
  .status-TODO { background: var(--todo); }
  .status-IN_PROGRESS { background: var(--progress); }
  .status-DONE { background: var(--done); }

  .priority-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: white;
  }
  .priority-LOW { background: var(--priority-low); }
  .priority-MEDIUM { background: var(--priority-medium); }
  .priority-HIGH { background: var(--priority-high); }

  .overdue-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    color: white;
    background: var(--danger);
    margin-left: 6px;
    white-space: nowrap;
  }

  select {
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: white;
  }

  .filters {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .filter-field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .filter-field select {
    font-size: 13px;
    padding: 6px 8px;
  }
  .filter-field.checkbox-field label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    text-transform: none;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0;
    padding-bottom: 7px;
  }
  .filter-field.checkbox-field input {
    width: auto;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .pagination button {
    padding: 5px 12px;
    font-size: 12px;
  }
  .pagination button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .filter-note {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 12px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .filter-note.active { display: flex; }
  .filter-note button {
    padding: 4px 10px;
    font-size: 12px;
  }

  .row-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: nowrap;
    white-space: nowrap;
  }
  .row-actions button {
    padding: 5px 10px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    align-items: center;
    justify-content: center;
  }
  .overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 8px;
    padding: 24px;
    width: 340px;
  }
  .modal h3 {
    margin: 0 0 16px 0;
    font-size: 15px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 13px;
  }
  .field .hint {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    font-weight: 400;
  }
  .checkbox-list {
    border: 1px solid var(--border);
    border-radius: 5px;
    max-height: 160px;
    overflow-y: auto;
    background: var(--panel);
  }
  .checkbox-list .checkbox-option {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    text-transform: none;
    cursor: pointer;
    border-bottom: 1px solid var(--bg);
  }
  .checkbox-list .checkbox-option:last-child {
    border-bottom: none;
  }
  .checkbox-list .checkbox-option:hover {
    background: var(--bg);
  }
  .checkbox-list .checkbox-option input[type="checkbox"] {
    flex: 0 0 auto;
    order: -1;
    margin: 0;
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .checkbox-list .checkbox-option span {
    flex: 1 1 auto;
    text-align: left;
  }
  .checkbox-list .empty-hint {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 10px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .error-box {
    background: #fbeaea;
    color: var(--danger);
    border: 1px solid #e5b6b6;
    padding: 10px 14px;
    border-radius: 5px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .error-box.active { display: block; }

  .api-config {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .api-config input {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 220px;
  }

  /* Login screen */
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    width: 320px;
  }
  .login-card h1 {
    font-size: 20px;
    margin: 0 0 20px 0;
    text-align: center;
  }
  .login-card button { width: 100%; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Task Manager</h1>
    <div class="error-box" id="loginError"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUsernameInput" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPasswordInput" autocomplete="current-password">
    </div>
    <button id="loginBtn">Log in</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell" style="display:none;">

<header>
  <div class="user-bar">
    <h1>Task Manager</h1>
    <div class="user-info">
      <span id="currentUserLabel"></span>
      <button class="secondary" id="editAdminAccountBtn" style="display:none;" onclick="openEditAdminAccount()">Edit my account</button>
      <button class="secondary" id="logoutBtn">Log out</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="workers">Workers</div>
    <div class="tab" data-tab="tasks">Tasks</div>
  </div>
</header>

<main>
  <div class="api-config">
    API base URL: <input type="text" id="apiBaseInput" value="http://localhost:8080/api/v1">
    <button class="secondary" id="reloadBtn" style="margin-left:6px;">Reload</button>
  </div>

  <div class="error-box" id="errorBox"></div>

  <!-- WORKERS PANEL -->
  <section class="panel active" id="panel-workers">
    <div class="panel-header">
      <h2>Existing workers</h2>
      <button id="addWorkerBtn">+ Add worker</button>
    </div>
    <div class="filters">
      <div class="filter-field" id="workerDepartmentFilterField">
        <label>Department</label>
        <select id="filterWorkerDepartment">
          <option value="">All</option>
          <option value="IT">IT</option>
          <option value="HR">HR</option>
          <option value="ACCOUNTING">ACCOUNTING</option>
        </select>
      </div>
      <button class="secondary" id="filterWorkerClearBtn">Clear filters</button>
    </div>
    <div class="table-scroll">
      <table id="workersTable">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Department</th><th>Type</th><th>Tasks</th><th></th></tr>
        </thead>
        <tbody id="workersTbody"></tbody>
      </table>
    </div>
    <div class="empty" id="workersEmpty" style="display:none;">No workers yet. Add the first one.</div>
    <div class="pagination">
      <button class="secondary" id="workerPrevBtn">Prev</button>
      <span id="workerPageInfo"></span>
      <button class="secondary" id="workerNextBtn">Next</button>
    </div>
  </section>

  <!-- TASKS PANEL -->
  <section class="panel" id="panel-tasks">
    <div class="panel-header">
      <h2>Existing tasks</h2>
      <button id="addTaskBtn">+ Add task</button>
    </div>
    <div class="filter-note" id="taskWorkerFilterNote"></div>
    <div class="filters">
      <div class="filter-field">
        <label>Priority</label>
        <select id="filterPriority">
          <option value="">All</option>
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
        </select>
      </div>
      <div class="filter-field">
        <label>Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          <option value="TODO">TODO</option>
          <option value="IN_PROGRESS">IN_PROGRESS</option>
          <option value="DONE">DONE</option>
        </select>
      </div>
      <div class="filter-field" id="taskDepartmentFilterField">
        <label>Department</label>
        <select id="filterDepartment">
          <option value="">All</option>
          <option value="IT">IT</option>
          <option value="HR">HR</option>
          <option value="ACCOUNTING">ACCOUNTING</option>
        </select>
      </div>
      <div class="filter-field checkbox-field">
        <label><input type="checkbox" id="filterOverdue"> Overdue only</label>
      </div>
      <button class="secondary" id="filterClearBtn">Clear filters</button>
    </div>
    <div class="table-scroll">
      <table id="tasksTable">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Status</th><th>Priority</th><th>Department</th><th>Due date</th><th>Worker</th><th></th></tr>
        </thead>
        <tbody id="tasksTbody"></tbody>
      </table>
    </div>
    <div class="empty" id="tasksEmpty" style="display:none;">No tasks yet. Add the first one.</div>
    <div class="pagination">
      <button class="secondary" id="taskPrevBtn">Prev</button>
      <span id="taskPageInfo"></span>
      <button class="secondary" id="taskNextBtn">Next</button>
    </div>
  </section>
</main>

<!-- ADD/EDIT WORKER MODAL -->
<div class="overlay" id="workerModal">
  <div class="modal">
    <h3 id="workerModalTitle">Add worker</h3>
    <div class="error-box" id="workerModalError"></div>
    <div class="field">
      <label>Name *</label>
      <input type="text" id="workerNameInput" placeholder="e.g. Ján Novák">
    </div>
    <div class="field">
      <label>Department *</label>
      <select id="workerDepartmentInput">
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="ACCOUNTING">ACCOUNTING</option>
      </select>
    </div>
    <div class="field" id="workerTypeField">
      <label>Worker type *</label>
      <select id="workerTypeInput">
        <option value="EMPLOYEE">Employee</option>
        <option value="MANAGER">Manager</option>
      </select>
    </div>
    <div class="field">
      <label>Username *</label>
      <input type="text" id="workerUsernameInput" placeholder="e.g. jnovak" autocomplete="off">
    </div>
    <div class="field">
      <label id="workerPasswordLabel">Password *</label>
      <input type="password" id="workerPasswordInput" autocomplete="new-password">
    </div>
    <div class="field" id="workerTasksField">
      <label>Assign tasks (optional)</label>
      <div class="checkbox-list" id="workerTasksInput"></div>
    </div>
    <div class="modal-actions">
      <button class="secondary" id="workerCancelBtn">Cancel</button>
      <button id="workerSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ADD/EDIT TASK MODAL -->
<div class="overlay" id="taskModal">
  <div class="modal">
    <h3 id="taskModalTitle">Add task</h3>
    <div class="error-box" id="taskModalError"></div>
    <div class="field">
      <label>Name *</label>
      <input type="text" id="taskNameInput" placeholder="e.g. Naprogramovať API">
    </div>
    <div class="field">
      <label>Status *</label>
      <select id="taskStatusInput">
        <option value="TODO">TODO</option>
        <option value="IN_PROGRESS">IN_PROGRESS</option>
        <option value="DONE">DONE</option>
      </select>
    </div>
    <div class="field">
      <label>Priority *</label>
      <select id="taskPriorityInput">
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="HIGH">HIGH</option>
      </select>
    </div>
    <div class="field">
      <label>Department *</label>
      <select id="taskDepartmentInput">
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="ACCOUNTING">ACCOUNTING</option>
      </select>
    </div>
    <div class="field">
      <label>Due date *</label>
      <input type="datetime-local" id="taskDueDateInput">
    </div>
    <div class="field">
      <label>Assigned worker</label>
      <select id="taskWorkerInput">
        <option value="">— none —</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="secondary" id="taskCancelBtn">Cancel</button>
      <button id="taskSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- EDIT ADMIN ACCOUNT MODAL -->
<div class="overlay" id="adminAccountModal">
  <div class="modal">
    <h3>Edit my account</h3>
    <div class="error-box" id="adminAccountModalError"></div>
    <div class="field">
      <label>Username *</label>
      <input type="text" id="adminAccountUsernameInput" autocomplete="off">
    </div>
    <div class="field">
      <label>New password (leave blank to keep current)</label>
      <input type="password" id="adminAccountPasswordInput" autocomplete="new-password">
    </div>
    <div class="modal-actions">
      <button class="secondary" id="adminAccountCancelBtn">Cancel</button>
      <button id="adminAccountSaveBtn">Save</button>
    </div>
  </div>
</div>

</div>
<!-- /APP SHELL -->

<script>
let API_BASE = document.getElementById('apiBaseInput').value;
const PAGE_SIZE = 20;
let currentUser = null;
let workers = [];
let tasks = [];
let editingWorkerId = null;
let editingTaskId = null;
let workerPage = 0;
let workerTotalPages = 0;
let workerTotalElements = 0;
let taskPage = 0;
let taskTotalPages = 0;
let taskTotalElements = 0;
let taskWorkerIdFilter = null;

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ---------- Error handling ----------
function showError(message, boxId = 'errorBox') {
  const box = document.getElementById(boxId);
  box.textContent = message;
  box.classList.add('active');
}
function clearError(boxId = 'errorBox') {
  document.getElementById(boxId).classList.remove('active');
}

// ---------- Auth / session ----------
// The session id lives only in an HttpOnly cookie (never a URL), so credentials: 'include'
// is what carries it - there is no token to copy out of a URL or paste elsewhere.
function getCsrfToken() {
  const match = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
  return match ? decodeURIComponent(match[1]) : null;
}
function showLoginScreen() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
}
function showAppShell() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
}
function handleUnauthenticated() {
  currentUser = null;
  showLoginScreen();
}
function applyRoleVisibility() {
  const role = currentUser.role;
  const parts = ['Logged in as ' + currentUser.name + ' (' + role + ')'];
  if (currentUser.department) parts.push(currentUser.department + ' department');
  document.getElementById('currentUserLabel').textContent = parts.join(' — ');

  document.getElementById('addWorkerBtn').style.display = role === 'EMPLOYEE' ? 'none' : '';
  document.getElementById('addTaskBtn').style.display = role === 'EMPLOYEE' ? 'none' : '';

  const isAdmin = role === 'ADMIN';
  document.getElementById('workerDepartmentFilterField').style.display = isAdmin ? '' : 'none';
  document.getElementById('taskDepartmentFilterField').style.display = isAdmin ? '' : 'none';
  // Admin isn't a Worker row, so it has no row in the Workers tab to self-edit from -
  // this button is its only way to change username/password.
  document.getElementById('editAdminAccountBtn').style.display = isAdmin ? '' : 'none';
}
async function bootstrapSession() {
  try {
    const res = await fetch(API_BASE + '/auth/me', { credentials: 'include' });
    if (!res.ok) {
      showLoginScreen();
      return;
    }
    currentUser = await res.json();
    showAppShell();
    applyRoleVisibility();
    await loadAll();
  } catch (e) {
    showLoginScreen();
  }
}
document.getElementById('loginBtn').addEventListener('click', async () => {
  const username = document.getElementById('loginUsernameInput').value.trim();
  const password = document.getElementById('loginPasswordInput').value;
  clearError('loginError');
  if (!username || !password) {
    showError('Username and password are required', 'loginError');
    return;
  }
  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username, password }).toString()
    });
    if (!res.ok) {
      throw new Error('Invalid username or password');
    }
    document.getElementById('loginPasswordInput').value = '';
    await bootstrapSession();
  } catch (e) {
    showError(e.message, 'loginError');
  }
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  try {
    await fetch(API_BASE + '/auth/logout', {
      method: 'POST',
      credentials: 'include',
      headers: { 'X-XSRF-TOKEN': getCsrfToken() }
    });
  } catch (e) {
    // ignore - we're clearing local state regardless
  }
  handleUnauthenticated();
});

// ---------- API helpers ----------
async function apiGet(path) {
  const res = await fetch(API_BASE + path, { credentials: 'include' });
  if (res.status === 401) handleUnauthenticated();
  if (!res.ok) throw new Error('GET ' + path + ' failed (' + res.status + ')');
  return res.status === 204 ? null : res.json();
}
async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': getCsrfToken() },
    body: JSON.stringify(body)
  });
  if (res.status === 401) handleUnauthenticated();
  if (!res.ok) throw new Error(await errorMessage(res, 'POST ' + path));
  return res.status === 204 ? null : res.json();
}
async function apiPut(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': getCsrfToken() },
    body: JSON.stringify(body)
  });
  if (res.status === 401) handleUnauthenticated();
  if (!res.ok) throw new Error(await errorMessage(res, 'PUT ' + path));
  return res.status === 204 ? null : res.json();
}
async function apiPatch(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'PATCH',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': getCsrfToken() },
    body: JSON.stringify(body)
  });
  if (res.status === 401) handleUnauthenticated();
  if (!res.ok) throw new Error(await errorMessage(res, 'PATCH ' + path));
  return res.status === 204 ? null : res.json();
}
async function errorMessage(res, label) {
  let text = await res.text().catch(() => '');
  // If the body is a Spring Boot error JSON, pull out just the human-readable message
  try {
    const parsed = JSON.parse(text);
    text = parsed.message || parsed.error || text;
  } catch (e) { /* plain-text body - keep as is */ }
  // Never flood the error box (e.g. an unexpected stack trace in the response body)
  if (text.length > 300) text = text.slice(0, 300) + '…';
  return text || (label + ' failed (' + res.status + ')');
}
async function apiDelete(path) {
  const res = await fetch(API_BASE + path, {
    method: 'DELETE',
    credentials: 'include',
    headers: { 'X-XSRF-TOKEN': getCsrfToken() }
  });
  if (res.status === 401) handleUnauthenticated();
  if (!res.ok) throw new Error('DELETE ' + path + ' failed (' + res.status + ')');
}

// ---------- Load data ----------
function buildWorkerQuery() {
  const params = new URLSearchParams();
  params.set('page', workerPage);
  params.set('size', PAGE_SIZE);
  const department = document.getElementById('filterWorkerDepartment').value;
  if (department) params.set('department', department);
  return params.toString();
}
function buildTaskQuery() {
  const params = new URLSearchParams();
  params.set('page', taskPage);
  params.set('size', PAGE_SIZE);
  const priority = document.getElementById('filterPriority').value;
  const status = document.getElementById('filterStatus').value;
  const department = document.getElementById('filterDepartment').value;
  const overdueOnly = document.getElementById('filterOverdue').checked;
  if (priority) params.set('priority', priority);
  if (status) params.set('status', status);
  if (department) params.set('department', department);
  if (overdueOnly) params.set('overdueOnly', 'true');
  if (taskWorkerIdFilter != null) params.set('workerId', taskWorkerIdFilter);
  return params.toString();
}
async function fetchWorkersPage() {
  const result = await apiGet('/workers?' + buildWorkerQuery());
  workers = result.content;
  workerTotalPages = result.totalPages;
  workerTotalElements = result.totalElements;
}
async function fetchTasksPage() {
  const result = await apiGet('/tasks?' + buildTaskQuery());
  tasks = result.content;
  taskTotalPages = result.totalPages;
  taskTotalElements = result.totalElements;
}
async function loadWorkers() {
  await fetchWorkersPage();
  if (!workers.length && workerPage > 0 && workerPage >= workerTotalPages) {
    workerPage = Math.max(0, workerTotalPages - 1);
    await fetchWorkersPage();
  }
  renderWorkers();
}
async function loadTasks() {
  await fetchTasksPage();
  if (!tasks.length && taskPage > 0 && taskPage >= taskTotalPages) {
    taskPage = Math.max(0, taskTotalPages - 1);
    await fetchTasksPage();
  }
  renderTasks();
}
async function loadAll() {
  clearError();
  try {
    await loadWorkers();
    await loadTasks();
  } catch (e) {
    showError('Could not reach API at ' + API_BASE + '. Is the backend running and CORS enabled? (' + e.message + ')');
  }
}

// ---------- Worker filters ----------
function isAnyWorkerFilterActive() {
  return !!document.getElementById('filterWorkerDepartment').value;
}

// ---------- Render workers ----------
function renderWorkerActions(w) {
  const canManage = currentUser.role === 'ADMIN' ||
    (currentUser.role === 'MANAGER' && w.workerType !== 'MANAGER');
  if (canManage) {
    return `<button class="secondary" onclick="openEditWorker(${w.id})">Edit</button>
        <button class="danger" onclick="deleteWorker(${w.id})">Delete</button>`;
  }
  // Self-service: anyone (Employee or Manager) may edit their own row - name/username/password
  // only, no delete. Backend enforces the same restriction regardless of what the UI sends.
  const isSelf = currentUser.workerId != null && w.id === currentUser.workerId;
  if (isSelf) {
    return `<button class="secondary" onclick="openEditWorker(${w.id})">Edit</button>`;
  }
  return '';
}
function renderWorkers() {
  const tbody = document.getElementById('workersTbody');
  tbody.innerHTML = '';
  const emptyEl = document.getElementById('workersEmpty');
  if (!workerTotalElements) {
    emptyEl.textContent = isAnyWorkerFilterActive() ? 'No workers match the selected filters.' : 'No workers yet. Add the first one.';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
  }

  workers.forEach(w => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${w.id}</td>
      <td>${escapeHtml(w.name)}</td>
      <td>${escapeHtml(w.department || '—')}</td>
      <td>${escapeHtml(w.workerType || '—')}</td>
      <td><button class="secondary" onclick="viewWorkerTasks(${w.id})">View tasks</button></td>
      <td><div class="row-actions">${renderWorkerActions(w)}</div></td>`;
    tbody.appendChild(tr);
  });

  renderWorkerPagination();
}
function renderWorkerPagination() {
  const info = document.getElementById('workerPageInfo');
  info.textContent = workerTotalElements
    ? `Page ${workerPage + 1} of ${workerTotalPages} (${workerTotalElements} total workers)`
    : 'No results';
  document.getElementById('workerPrevBtn').disabled = workerPage <= 0;
  document.getElementById('workerNextBtn').disabled = workerPage >= workerTotalPages - 1;
}
function viewWorkerTasks(workerId) {
  taskWorkerIdFilter = workerId;
  taskPage = 0;
  document.querySelector('.tab[data-tab="tasks"]').click();
  loadTasks();
}

// ---------- Task filters ----------
function isAnyTaskFilterActive() {
  return !!(document.getElementById('filterPriority').value ||
            document.getElementById('filterStatus').value ||
            document.getElementById('filterDepartment').value ||
            document.getElementById('filterOverdue').checked ||
            taskWorkerIdFilter != null);
}

// ---------- Render tasks ----------
function renderTaskWorkerFilterNote() {
  const note = document.getElementById('taskWorkerFilterNote');
  if (taskWorkerIdFilter == null) {
    note.classList.remove('active');
    note.innerHTML = '';
    return;
  }
  const worker = workers.find(w => w.id === taskWorkerIdFilter);
  const label = worker ? worker.name : ('#' + taskWorkerIdFilter);
  note.innerHTML = `<span>Showing tasks for worker: <strong>${escapeHtml(label)}</strong></span>`;
  const clearBtn = document.createElement('button');
  clearBtn.className = 'secondary';
  clearBtn.textContent = 'Clear';
  clearBtn.addEventListener('click', () => {
    taskWorkerIdFilter = null;
    taskPage = 0;
    loadTasks();
  });
  note.appendChild(clearBtn);
  note.classList.add('active');
}
function renderTaskActions(t) {
  if (currentUser.role === 'EMPLOYEE') {
    if (t.workerId !== currentUser.workerId) return '';
    const options = ['TODO', 'IN_PROGRESS', 'DONE']
      .map(s => `<option value="${s}"${t.status === s ? ' selected' : ''}>${s}</option>`)
      .join('');
    return `<select onchange="updateTaskStatusInline(${t.id}, this.value)">${options}</select>`;
  }
  return `<button class="secondary" onclick="openEditTask(${t.id})">Edit</button>
        <button class="danger" onclick="deleteTask(${t.id})">Delete</button>`;
}
function renderTasks() {
  const tbody = document.getElementById('tasksTbody');
  tbody.innerHTML = '';
  renderTaskWorkerFilterNote();
  const emptyEl = document.getElementById('tasksEmpty');
  if (!taskTotalElements) {
    emptyEl.textContent = isAnyTaskFilterActive() ? 'No tasks match the selected filters.' : 'No tasks yet. Add the first one.';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
  }

  tasks.forEach(t => {
    const workerName = t.workerId ? (workers.find(w => w.id === t.workerId)?.name || t.workerName || ('#' + t.workerId)) : '—';
    const status = t.status || 'TODO';
    const priority = t.priority || 'MEDIUM';
    const overdue = isOverdue(t);
    const dueDateText = t.dueDate ? new Date(t.dueDate).toLocaleString() : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.id}</td>
      <td>${escapeHtml(t.name)}</td>
      <td><span class="status-badge status-${status}">${status}</span></td>
      <td><span class="priority-badge priority-${priority}">${priority}</span></td>
      <td>${escapeHtml(t.department || '—')}</td>
      <td>${escapeHtml(dueDateText)}${overdue ? ' <span class="overdue-badge">OVERDUE</span>' : ''}</td>
      <td>${escapeHtml(workerName)}</td>
      <td><div class="row-actions">${renderTaskActions(t)}</div></td>`;
    tbody.appendChild(tr);
  });

  renderTaskPagination();
}
function renderTaskPagination() {
  const info = document.getElementById('taskPageInfo');
  info.textContent = taskTotalElements
    ? `Page ${taskPage + 1} of ${taskTotalPages} (${taskTotalElements} total tasks)`
    : 'No results';
  document.getElementById('taskPrevBtn').disabled = taskPage <= 0;
  document.getElementById('taskNextBtn').disabled = taskPage >= taskTotalPages - 1;
}
async function updateTaskStatusInline(id, status) {
  clearError();
  try {
    await apiPatch('/tasks/' + id + '/status', { status });
    await loadTasks();
  } catch (e) {
    showError('Could not update status (' + e.message + ')');
    await loadTasks();
  }
}

function isOverdue(t) {
  return !!t.dueDate && t.status !== 'DONE' && new Date(t.dueDate).getTime() < Date.now();
}

// Fetches a fresh, department-scoped list rather than reusing the (paginated) `workers`
// array, since the currently loaded page of workers may not include every match.
async function renderTaskWorkerOptions() {
  const department = document.getElementById('taskDepartmentInput').value;
  const select = document.getElementById('taskWorkerInput');
  select.innerHTML = '<option value="">— none —</option>';
  if (!department) return;
  try {
    const result = await apiGet('/workers?department=' + encodeURIComponent(department) + '&size=100');
    result.content.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.id;
      opt.textContent = w.name;
      select.appendChild(opt);
    });
  } catch (e) {
    // leave the dropdown at "— none —"; the server-side department check still guards saving
  }
}

function escapeHtml(str) {
  if (str == null) return '';
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Worker modal ----------
document.getElementById('addWorkerBtn').addEventListener('click', () => openWorkerModal());
document.getElementById('workerCancelBtn').addEventListener('click', () => closeWorkerModal());

// Fetches a fresh, department-scoped list rather than reusing the (paginated) `tasks`
// array, and uses each task's own workerId (not the possibly-stale local array) to
// decide which checkboxes start checked.
async function renderWorkerTaskOptions() {
  const department = document.getElementById('workerDepartmentInput').value;
  const container = document.getElementById('workerTasksInput');
  container.innerHTML = '';
  if (!department) return;
  try {
    const result = await apiGet('/tasks?department=' + encodeURIComponent(department) + '&size=100');
    if (!result.content.length) {
      container.innerHTML = '<div class="empty-hint">No tasks in this department.</div>';
      return;
    }
    result.content.forEach(t => {
      const label = document.createElement('label');
      label.className = 'checkbox-option';
      const checked = (editingWorkerId != null && t.workerId === editingWorkerId) ? ' checked' : '';
      label.innerHTML = `<input type="checkbox" value="${t.id}"${checked}><span>${escapeHtml(t.name)}</span>`;
      container.appendChild(label);
    });
  } catch (e) {
    container.innerHTML = '<div class="empty-hint">Could not load tasks.</div>';
  }
}
document.getElementById('workerDepartmentInput').addEventListener('change', () => {
  renderWorkerTaskOptions();
});
function openWorkerModal() {
  editingWorkerId = null;
  clearError('workerModalError');
  document.getElementById('workerModalTitle').textContent = 'Add worker';
  document.getElementById('workerNameInput').value = '';
  document.getElementById('workerUsernameInput').value = '';
  document.getElementById('workerPasswordInput').value = '';
  document.getElementById('workerPasswordLabel').textContent = 'Password *';

  const deptInput = document.getElementById('workerDepartmentInput');
  const isManager = currentUser.role === 'MANAGER';
  deptInput.value = isManager ? currentUser.department : 'IT';
  deptInput.disabled = isManager;

  const typeField = document.getElementById('workerTypeField');
  const typeInput = document.getElementById('workerTypeInput');
  typeField.style.display = '';
  typeInput.innerHTML = isManager
    ? '<option value="EMPLOYEE">Employee</option>'
    : '<option value="EMPLOYEE">Employee</option><option value="MANAGER">Manager</option>';
  typeInput.value = 'EMPLOYEE';

  renderWorkerTaskOptions();
  document.getElementById('workerModal').classList.add('active');
}
function openEditWorker(id) {
  const w = workers.find(w => w.id === id);
  if (!w) return;
  editingWorkerId = id;
  clearError('workerModalError');
  document.getElementById('workerModalTitle').textContent = 'Edit worker';
  document.getElementById('workerNameInput').value = w.name;
  document.getElementById('workerUsernameInput').value = w.username;
  document.getElementById('workerPasswordInput').value = '';
  document.getElementById('workerPasswordLabel').textContent = 'New password (leave blank to keep current)';

  // Editing your own row (Employee or Manager) is self-service only: no department change,
  // no task (re)assignment - matches what WorkerService.updateWorker actually allows.
  const isSelf = currentUser.role !== 'ADMIN' && currentUser.workerId != null && id === currentUser.workerId;

  const deptInput = document.getElementById('workerDepartmentInput');
  deptInput.value = w.department || 'IT';
  deptInput.disabled = currentUser.role === 'MANAGER' || isSelf;

  // a worker's type is fixed at creation - not editable afterwards
  document.getElementById('workerTypeField').style.display = 'none';

  const tasksField = document.getElementById('workerTasksField');
  if (isSelf) {
    tasksField.style.display = 'none';
  } else {
    tasksField.style.display = '';
    renderWorkerTaskOptions();
  }

  document.getElementById('workerModal').classList.add('active');
}
function closeWorkerModal() {
  document.getElementById('workerModal').classList.remove('active');
}
document.getElementById('workerSaveBtn').addEventListener('click', async () => {
  const name = document.getElementById('workerNameInput').value.trim();
  const department = document.getElementById('workerDepartmentInput').value;
  const username = document.getElementById('workerUsernameInput').value.trim();
  const password = document.getElementById('workerPasswordInput').value;
  const workerType = document.getElementById('workerTypeInput').value;
  clearError('workerModalError');
  if (!name) {
    showError('Name is required', 'workerModalError');
    return;
  }
  if (!department) {
    showError('Department is required', 'workerModalError');
    return;
  }
  if (!username) {
    showError('Username is required', 'workerModalError');
    return;
  }
  if (!editingWorkerId && !password) {
    showError('Password is required', 'workerModalError');
    return;
  }
  const taskIds = Array.from(document.getElementById('workerTasksInput').querySelectorAll('input:checked')).map(cb => Number(cb.value));
  const body = { name, department, username, workerType, taskIds };
  if (password) body.password = password;
  try {
    if (editingWorkerId) {
      await apiPut('/workers/' + editingWorkerId, body);
    } else {
      await apiPost('/workers', body);
    }
    closeWorkerModal();
    await loadAll();
  } catch (e) {
    showError('Could not save worker (' + e.message + ')', 'workerModalError');
  }
});
async function deleteWorker(id) {
  if (!confirm('Delete this worker?')) return;
  clearError();
  try {
    await apiDelete('/workers/' + id);
    await loadAll();
  } catch (e) {
    showError('Could not delete worker (' + e.message + ')');
  }
}

// ---------- Admin self-edit (Admin has no Worker row, so no place in the Workers tab) ----------
function openEditAdminAccount() {
  clearError('adminAccountModalError');
  document.getElementById('adminAccountUsernameInput').value = currentUser.username;
  document.getElementById('adminAccountPasswordInput').value = '';
  document.getElementById('adminAccountModal').classList.add('active');
}
function closeAdminAccountModal() {
  document.getElementById('adminAccountModal').classList.remove('active');
}
document.getElementById('adminAccountCancelBtn').addEventListener('click', closeAdminAccountModal);
document.getElementById('adminAccountSaveBtn').addEventListener('click', async () => {
  const username = document.getElementById('adminAccountUsernameInput').value.trim();
  const password = document.getElementById('adminAccountPasswordInput').value;
  clearError('adminAccountModalError');
  if (!username) {
    showError('Username is required', 'adminAccountModalError');
    return;
  }
  const body = { username };
  if (password) body.password = password;
  try {
    const updated = await apiPut('/auth/me', body);

document.getElementById('filterWorkerDepartment').addEventListener('change', () => {

});
document.getElementById('filterWorkerClearBtn').addEventListener('click', () => {

document.getElementById('filterPriority').addEventListener('change', () => {
  taskPage = 0;
  loadTasks();
});
document.getElementById('filterStatus').addEventListener('change', () => {
  taskPage = 0;
  loadTasks();
});
document.getElementById('filterDepartment').addEventListener('change', () => {
  taskPage = 0;
  loadTasks();
});
document.getElementById('filterOverdue').addEventListener('change', () => {
  taskPage = 0;
  loadTasks();
});
document.getElementById('filterClearBtn').addEventListener('click', () => {
  document.getElementById('filterPriority').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterDepartment').value = '';

  if (taskPage > 0) {

document.getElementById('taskNextBtn').addEventListener('click', () => {
  if (taskPage < taskTotalPages - 1) {

    loadTasks();

// ---------- Task modal ----------
document.getElementById('addTaskBtn').addEventListener('click', () => openTaskModal());
document.getElementById('taskCancelBtn').addEventListener('click', () => closeTaskModal());

function localDateTimeInputValue(date) {
  const pad = n => String(n).padStart(2, '0');
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
    + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}
document.getElementById('taskDepartmentInput').addEventListener('change', async () => {
  await renderTaskWorkerOptions();
  document.getElementById('taskWorkerInput').value = '';
});
async function openTaskModal() {
  editingTaskId = null;
  clearError('taskModalError');
  document.getElementById('taskModalTitle').textContent = 'Add task';
  document.getElementById('taskNameInput').value = '';
  document.getElementById('taskStatusInput').value = 'TODO';
  document.getElementById('taskPriorityInput').value = 'MEDIUM';

  const deptInput = document.getElementById('taskDepartmentInput');
  const isManager = currentUser.role === 'MANAGER';
  deptInput.value = isManager ? currentUser.department : 'IT';
  deptInput.disabled = isManager;

  const dueDateInput = document.getElementById('taskDueDateInput');
  dueDateInput.value = '';
  dueDateInput.min = localDateTimeInputValue(new Date());
  await renderTaskWorkerOptions();
  document.getElementById('taskWorkerInput').value = '';
  document.getElementById('taskModal').classList.add('active');
}
async function openEditTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editingTaskId = id;
  clearError('taskModalError');
  document.getElementById('taskModalTitle').textContent = 'Edit task';
  document.getElementById('taskNameInput').value = t.name;
  document.getElementById('taskStatusInput').value = t.status || 'TODO';
  document.getElementById('taskPriorityInput').value = t.priority || 'MEDIUM';

  const deptInput = document.getElementById('taskDepartmentInput');
  deptInput.value = t.department || 'IT';
  deptInput.disabled = currentUser.role === 'MANAGER';

  const dueDateInput = document.getElementById('taskDueDateInput');
  dueDateInput.value = t.dueDate ? t.dueDate.slice(0, 16) : '';
  dueDateInput.min = localDateTimeInputValue(new Date());
  await renderTaskWorkerOptions();
  document.getElementById('taskWorkerInput').value = t.workerId ? t.workerId : '';
  document.getElementById('taskModal').classList.add('active');
}
function closeTaskModal() {
  document.getElementById('taskModal').classList.remove('active');
}
document.getElementById('taskSaveBtn').addEventListener('click', async () => {
  const name = document.getElementById('taskNameInput').value.trim();
  const status = document.getElementById('taskStatusInput').value;
  const priority = document.getElementById('taskPriorityInput').value;
  const department = document.getElementById('taskDepartmentInput').value;
  const dueDate = document.getElementById('taskDueDateInput').value;
  const workerId = document.getElementById('taskWorkerInput').value;

  clearError('taskModalError');
  if (!name) {
    showError('Name is required', 'taskModalError');
    return;
  }
  if (!status) {
    showError('Status is required', 'taskModalError');
    return;
  }
  if (!priority) {
    showError('Priority is required', 'taskModalError');
    return;
  }
  if (!department) {
    showError('Department is required', 'taskModalError');
    return;
  }
  if (!dueDate) {
    showError('Due date is required', 'taskModalError');
    return;
  }
  if (new Date(dueDate).getTime() <= Date.now()) {
    showError('Due date must be in the future', 'taskModalError');
    return;
  }

  // workerId null = unassigned ("— none —"); PUT always carries the full desired state
  const body = { name, status, priority, dueDate, department, workerId: workerId ? Number(workerId) : null };

  try {
    if (editingTaskId) {
      await apiPut('/tasks/' + editingTaskId, body);
    } else {
      await apiPost('/tasks', body);
    }
    closeTaskModal();
    await loadAll();
  } catch (e) {
    showError('Could not save task (' + e.message + ')', 'taskModalError');
  }
});
async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  clearError();
  try {
    await apiDelete('/tasks/' + id);
    await loadAll();
  } catch (e) {
    showError('Could not delete task (' + e.message + ')');
  }
}

document.getElementById('reloadBtn').addEventListener('click', () => {
  API_BASE = document.getElementById('apiBaseInput').value.replace(/\/$/, '');
  bootstrapSession();
});
