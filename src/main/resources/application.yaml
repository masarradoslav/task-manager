spring:
  application:
    name: task_manager
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  servlet:
    session:
      # cookie-only session tracking - disables the legacy ;jsessionid= URL fallback so a
      # session can never be "logged into" just by someone copying a URL that contains it
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax